name: Test GCP Authentication

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify identity and permissions
        run: |
          gcloud config set project "${{ vars.GCP_PROJECT_ID }}"
          gcloud auth list
          gcloud artifacts repositories describe wordrush \
            --location="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}"
          gcloud compute instance-groups managed describe wr-app-mig \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(name)"
