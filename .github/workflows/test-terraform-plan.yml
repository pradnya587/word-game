name: Test Terraform Deployment Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"

      - name: Initialize Terraform
        run: |
          terraform -chdir=infra/terraform/environment init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=wordrush/environment"

      - name: Generate plan without applying
        run: |
          terraform -chdir=infra/terraform/environment plan \
            -input=false \
            -parallelism=2 \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="state_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var="image_tag=20d6e82" \
            -no-color
