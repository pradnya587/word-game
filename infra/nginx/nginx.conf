# API gateway: the only container that is published on the VM. Everything else is internal.
#   /api/auth/*   -> auth-service
#   /api/stats/*  -> stats-service
#   /socket.io/*  -> game-service (WebSocket upgrade)
#   everything else -> frontend (Next.js)
worker_processes auto;
events { worker_connections 2048; }

http {
  # Docker's internal DNS: re-resolve names so a restarted container with a new IP is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream":"$upstream_addr"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  server_tokens off;
  client_max_body_size 100k;

  # Basic abuse protection for the auth endpoints (auth-service also has its own limiter).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

  server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /gateway/health { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /api/auth/ {
      limit_req zone=auth burst=20 nodelay;
      set $upstream auth-service:4001;
      proxy_pass http://$upstream;
    }

    location /api/stats/ {
      set $upstream stats-service:4003;
      proxy_pass http://$upstream;
    }

    location /socket.io/ {
      set $upstream game-service:4002;
      proxy_pass http://$upstream;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout  3600s;   # keep long-lived WebSocket connections open
      proxy_send_timeout  3600s;
      proxy_buffering off;
    }

    location / {
      set $upstream frontend:3000;
      proxy_pass http://$upstream;
    }
  }
}
