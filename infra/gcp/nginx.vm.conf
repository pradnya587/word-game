# Instance-local proxy: ONE backend port (80) for the external HTTPS load balancer.
#   /healthz  liveness  (game-service process is up)          -> autohealing health check
#   /readyz   readiness (Redis + snapshot DB reachable, not draining) -> load balancer health check
#   /api/auth/*  /api/stats/*  /socket.io/*  everything else -> frontend
worker_processes auto;
events { worker_connections 2048; }
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  log_format json escape=json '{"severity":"INFO","time":"$time_iso8601","remote":"$http_x_forwarded_for","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream":"$upstream_addr"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;
  server_tokens off;
  client_max_body_size 100k;

  # the Google load balancer sets X-Forwarded-For; use the client address in rate limiting
  map $http_x_forwarded_for $client_ip { default $remote_addr; "~^(?<first>[^,]+)" $first; }
  limit_req_zone $client_ip zone=auth:10m rate=10r/s;

  server {
    listen 80 default_server;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $client_ip;
    proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location = /healthz { access_log off; set $u game-service:4002; proxy_pass http://$u/health; }
    location = /readyz  { access_log off; set $u game-service:4002; proxy_pass http://$u/ready; }

    location /api/auth/  { limit_req zone=auth burst=20 nodelay; set $u auth-service:4001; proxy_pass http://$u; }
    location /api/stats/ { set $u stats-service:4003; proxy_pass http://$u; }
    location /socket.io/ {
      set $u game-service:4002; proxy_pass http://$u;
      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s; proxy_send_timeout 3600s; proxy_buffering off;
    }
    location / { set $u frontend:3000; proxy_pass http://$u; }
  }
}
