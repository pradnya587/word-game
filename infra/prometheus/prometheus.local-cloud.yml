global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: auth-service
    metrics_path: /metrics
    static_configs: [{ targets: ['auth-service:4001'] }]
  - job_name: game-service            # one target per replica: dashboards can split by instance
    metrics_path: /metrics
    static_configs:
      - targets: ['game-a:4002']
        labels: { replica: game-a }
      - targets: ['game-b:4002']
        labels: { replica: game-b }
  - job_name: stats-service
    metrics_path: /metrics
    static_configs: [{ targets: ['stats-service:4003'] }]
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
